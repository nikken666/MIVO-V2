<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIVO · Tiada sambungan</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:360px;background:#fff;border-radius:24px;padding:32px 24px;box-shadow:0 20px 50px rgba(0,0,0,.08)}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:18px 0 8px}
  p{margin:0 0 6px;color:#5f6368;font-size:14px;line-height:1.5}
  button{margin-top:18px;min-height:46px;padding:0 28px;border:0;border-radius:999px;background:#0071e3;color:#fff;font-size:15px;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="MIVO">
    <h1>Tiada sambungan internet</h1>
    <p>Semak sambungan anda, kemudian cuba lagi.</p>
    <p>No internet connection. Check your connection and try again.</p>
    <p>没有网络连接，请检查网络后再试。</p>
    <button type="button" onclick="location.reload()">Cuba lagi</button>
  </div>
</body>
</html>
